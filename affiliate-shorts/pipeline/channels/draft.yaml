upload_template: |
  # 投稿用

  ## タイトル

  {title}

  ## 説明

  {title}

  #PR
  フィクションです。体験談でも、収益の保証でもありません。
  テーマ: {theme}
  {channel_line}{genre_line}{voices}

  （リンクをプロフィールに置く前に出すときは、`#PR` の行とタグの #PR を外す。URL はどこにも書かない。イラストの出典URLは credits.json。）

  ## タグ

  {tags}

  ## 事実の根拠

  {theme}の寸劇。金額は無い。

  ## 投稿

  しない。
