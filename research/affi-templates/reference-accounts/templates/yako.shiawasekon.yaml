    role: 20〜30代の女性。1本の中では同じ顔と服。
    look: 写実。暖色。参照画像で固定。元動画の顔は使わない。
    voice: 落ち着いた女声。約200〜250Hz。推定。
    certainty: 推定
  - id: man
    role: 20〜30代の男性。1本の中では同じ顔と服。
    look: 写実。場面が変わると顔がずれることがある、と仕様。
    voice: 落ち着いた男声。約110〜130Hz。推定。
    certainty: 推定
timeline:
  - id: open
    start_s: 0
    end_s: 3
    picture: 男女が歩くか向き合う。街か店。夜、暖色、浅いボケ。
    speech: すぐ会話。ナレーションにしない。具体は入力。
    camera: 後ろ姿か中近景。1セリフ1ショット。
    on_screen_text: 題帯を約3秒。関係が変わる瞬間を予告する文。結末の台詞そのものは題にしない。
    certainty: 仕様どおり
  - id: middle
    start_s: 3
    end_s: 45
    picture: すれ違いから、関係が動く場所へ。1セリフ1ショット。2〜8秒。
    speech: 会話だけ。具体は入力。
    camera: 固定に近い。
    certainty: 推定（秒は59.7秒の例）
  - id: turn
    start_s: 45
    end_s: 60
    picture: 最後の1〜2セリフで関係が変わる。手をつなぐなどで終わる。
    speech: 関係が変わる台詞。具体は入力。
    camera: 寄り。
    certainty: 仕様どおり（伸びた型）
