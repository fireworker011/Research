<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>判断軸</title>
    <link rel="stylesheet" href="../css/base.css" />
  </head>
  <body class="fig">
    <div class="page">
      <i class="mark tl"></i>
      <i class="mark tr"></i>
      <i class="mark bl"></i>
      <i class="mark br"></i>
      <div class="frame">
        <div class="inner">
          <h1>3つ揃ったときだけ、作る</h1>
          <ol class="axes">
            <li>
              <span class="n">01</span>
              <div>
                <p class="q">需要があるか</p>
                <p class="a">止まっている場所に、置くものが薄いか</p>
              </div>
            </li>
            <li>
              <span class="n">02</span>
              <div>
                <p class="q">時間をかけずに出せるか</p>
                <p class="a">出す、選ぶ、まとめる、置く。今日は1工程</p>
              </div>
            </li>
            <li>
              <span class="n">03</span>
              <div>
                <p class="q">スマホの中で完結するか</p>
                <p class="a">別の機械を開く地点が、工程に無いか</p>
              </div>
            </li>
          </ol>
          <p class="foot">ひとつ欠ける日は、作らない</p>
        </div>
      </div>
    </div>
  </body>
</html>
