<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>作る流れ</title>
    <link rel="stylesheet" href="../css/base.css" />
  </head>
  <body class="fig">
    <div class="page">
      <i class="mark tl"></i>
      <i class="mark tr"></i>
      <i class="mark bl"></i>
      <i class="mark br"></i>
      <div class="frame">
        <div class="inner">
          <h1>作る流れは、4つだけ</h1>
          <ol class="steps">
            <li>
              <span class="n">01</span>
              <span class="name">出す</span>
              <span class="desc">線画素体を出す</span>
            </li>
            <li>
              <span class="n">02</span>
              <span class="name">選ぶ</span>
              <span class="desc">拡大して、残す</span>
            </li>
            <li>
              <span class="n">03</span>
              <span class="name">まとめる</span>
              <span class="desc">1枚の紙面に戻す</span>
            </li>
            <li>
              <span class="n">04</span>
              <span class="name">置く</span>
              <span class="desc">BOOTHの棚へ</span>
            </li>
          </ol>
        </div>
      </div>
    </div>
  </body>
</html>
