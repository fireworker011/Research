<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>チェックリスト</title>
    <link rel="stylesheet" href="../css/base.css" />
  </head>
  <body class="fig">
    <div class="page">
      <i class="mark tl"></i>
      <i class="mark tr"></i>
      <i class="mark bl"></i>
      <i class="mark br"></i>
      <div class="frame">
        <div class="inner">
          <h1>30分に写す、6つの問い</h1>
          <ol class="checks">
            <li><span class="box">01</span>棚を見てから作る</li>
            <li><span class="box">02</span>工程はスマホの中で閉じる</li>
            <li><span class="box">03</span>今日は1工程だけ</li>
            <li><span class="box">04</span>描かせないものを3つ書く</li>
            <li><span class="box">05</span>拡大して手・足・接地・重心</li>
            <li><span class="box">06</span>いいねの隣に保存を見る</li>
          </ol>
        </div>
      </div>
    </div>
  </body>
</html>
