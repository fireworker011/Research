<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>つまずきと直したこと</title>
    <link rel="stylesheet" href="../css/base.css" />
  </head>
  <body class="fig">
    <div class="page">
      <i class="mark tl"></i>
      <i class="mark tr"></i>
      <i class="mark bl"></i>
      <i class="mark br"></i>
      <div class="frame">
        <div class="inner">
          <h1>つまずきと、次に変えたこと</h1>
          <div class="heads">
            <p>つまずき</p>
            <span></span>
            <p>次に変えたこと</p>
          </div>
          <div class="pairs">
            <div class="pair">
              <p class="panel from">全部を<br />1枚に任せた</p>
              <span class="arrow">→</span>
              <p class="panel to">出すことと<br />揃えることを分ける</p>
            </div>
            <div class="pair">
              <p class="panel from">指示を足して<br />別の場所が崩れた</p>
              <span class="arrow">→</span>
              <p class="panel to">崩れたコマは<br />捨てる</p>
            </div>
            <div class="pair">
              <p class="panel from">縮小のまま<br />完成にした</p>
              <span class="arrow">→</span>
              <p class="panel to">拡大してから<br />残す</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
