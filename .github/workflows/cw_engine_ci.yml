name: CW Engine CI（応募しない）

on:
  pull_request:
    paths:
      - 'cw-engine/**'
      - '.github/workflows/cw_engine_*.yml'
      - 'affiliate-engine/src/hq-instruct.js'
      - 'affiliate-engine/docs/grok-bots/dump/G_hq_boot.txt'
      - 'affiliate-engine/docs/grok-bots/MACHINE.md'
  push:
    paths:
      - 'cw-engine/**'
      - '.github/workflows/cw_engine_*.yml'
      - 'affiliate-engine/src/hq-instruct.js'
      - 'affiliate-engine/docs/grok-bots/dump/G_hq_boot.txt'
      - 'affiliate-engine/docs/grok-bots/MACHINE.md'

concurrency:
  group: cw-engine-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: node --check と self-test
        run: |
          set -euo pipefail
          cd cw-engine
          node --check src/util.js
          node --check src/commander.js
          node --check src/qualify.js
          node --check src/queue.js
          node --check src/desk.js
          node --check src/report.js
          node --check src/apply-commander-comment.js
          node --check src/self-test.js
          node src/self-test.js
          node src/report.js
          cd ../affiliate-engine
          node src/hq-instruct.js --self-test
          cd ../cw-engine
          if grep -RInE 'crowdworks\.jp/login|puppeteer|playwright' src docs --exclude=self-test.js; then
            echo 'login automation must not land'
            exit 1
          fi
