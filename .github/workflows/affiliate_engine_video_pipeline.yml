name: Affiliate Engine 動画パイプライン（指示書のみ）

on:
  schedule:
    # 毎時11分。スロット自体は30分刻み。GitHub cron は遅延する前提で、
    # スクリプトが期日到来分を最大1件だけファイル化する（投稿しない）。
    - cron: '11 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ファイルを書かずプレビューのみ'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

concurrency:
  group: affiliate-video-pipeline
  cancel-in-progress: false

jobs:
  video-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 指示書の生成と 48h レビュー（投稿しない）
        run: |
          cd affiliate-engine
          node --check src/video-pipeline.js
          node src/video-pipeline.js --self-test
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node src/video-pipeline.js --emit --review --dry-run
          else
            node src/video-pipeline.js --emit --review
          fi

      - name: 生成物を保存
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add affiliate-engine/output/video/pipeline affiliate-engine/data/video || true
          git diff --staged --quiet || {
            git commit -m "chore: 動画パイプラインの指示書/レビュー"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "${{ github.ref_name }}"
          }
