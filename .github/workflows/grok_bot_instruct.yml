name: Grok Bot 指示役（投稿しない）

on:
  schedule:
    # 07:22 JST。dump を Bot に渡すだけ。Threads 投稿はしない。
    - cron: '22 22 * * *'
  workflow_dispatch:

concurrency:
  group: grok-bot-instruct
  cancel-in-progress: false

jobs:
  instruct:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: hq-instruct を Issue へ
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd affiliate-engine
          node --check src/hq-instruct.js
          node src/hq-instruct.js --self-test
          node src/hq-instruct.js
