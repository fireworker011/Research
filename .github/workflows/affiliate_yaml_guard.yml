name: Affiliate YAML ガード（投稿しない）

on:
  pull_request:
  push:
    paths:
      - '.github/workflows/affiliate_engine_post.yml'
      - '.github/workflows/affiliate_engine_insight.yml'
      - '.github/workflows/affiliate_engine_overlay_status.yml'
      - '.github/workflows/affiliate_engine_a8_yen.yml'
      - '.github/workflows/grok_bot_instruct.yml'
      - '.github/workflows/affiliate_yaml_guard.yml'

concurrency:
  group: affiliate-yaml-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Secret env があり本文アフィと amplify フラグが YAML に無い
        run: |
          set -euo pipefail
          for f in .github/workflows/affiliate_engine_post.yml .github/workflows/affiliate_engine_insight.yml; do
            grep -q 'AFFILIATE_LINKS_JSON' "$f"
            if grep -q 'AMPLIFY_ENABLED' "$f"; then
              echo "AMPLIFY_ENABLED must not be in $f"
              exit 1
            fi
            if grep -q 'AFFILIATE_BODY_LINKS' "$f"; then
              echo "AFFILIATE_BODY_LINKS must not be in $f"
              exit 1
            fi
          done
          if grep -q "^  schedule:" .github/workflows/affiliate_engine_post.yml .github/workflows/affiliate_engine_insight.yml; then
            echo "schedule must stay off"
            exit 1
          fi
          status=.github/workflows/affiliate_engine_overlay_status.yml
          if [ -f "$status" ]; then
            grep -q 'AFFILIATE_LINKS_JSON' "$status"
            grep -q 'workflow_dispatch' "$status"
            if grep -q "^  schedule:" "$status"; then
              echo "overlay status must not have schedule"
              exit 1
            fi
            if grep -q 'threads-poster.js' "$status" || grep -q 'amplify.js' "$status"; then
              echo "overlay status must not post"
              exit 1
            fi
            if grep -q 'AMPLIFY_ENABLED' "$status" || grep -q 'AFFILIATE_BODY_LINKS' "$status"; then
              echo "overlay status must not enable body links or amplify"
              exit 1
            fi
            if grep -q 'claude/monthly-revenue-system-gvi02u' "$status"; then
              echo "overlay status must checkout default, not production"
              exit 1
            fi
            grep -q 'overlay-keys.js' "$status"
          fi
          yen=.github/workflows/affiliate_engine_a8_yen.yml
          if [ -f "$yen" ]; then
            if grep -q "^  schedule:" "$yen"; then
              echo "a8 yen must not have schedule"
              exit 1
            fi
            if grep -q 'threads-poster.js' "$yen" || grep -q 'amplify.js' "$yen"; then
              echo "a8 yen must not post"
              exit 1
            fi
            grep -q 'github-actions\[bot\]' "$yen"
            grep -q 'push_failed' "$yen"
          fi
          instruct=.github/workflows/grok_bot_instruct.yml
          if [ -f "$instruct" ]; then
            if ! grep -q "^  schedule:" "$instruct"; then
              echo "grok instruct must keep schedule"
              exit 1
            fi
            if ! grep -q "^  push:" "$instruct"; then
              echo "grok instruct must keep push (first run on default merge)"
              exit 1
            fi
            if ! grep -q 'workflow_dispatch' "$instruct"; then
              echo "grok instruct must keep workflow_dispatch"
              exit 1
            fi
            if grep -q 'threads-poster.js' "$instruct" || grep -q 'amplify.js' "$instruct"; then
              echo "grok instruct must not post"
              exit 1
            fi
            grep -q 'AFFILIATE_LINKS_JSON' "$instruct"
            grep -q 'overlay-keys.js' "$instruct"
            grep -q 'affi-step.js' "$instruct"
            grep -q 'affiliate-engine/data/conversions.csv' "$instruct"
            if ! grep -q 'issue_comment' "$instruct"; then
              echo "grok instruct must run on human issue comments"
              exit 1
            fi
          fi
