name: Affiliate YAML ガード（投稿しない）

on:
  pull_request:
  push:
    paths:
      - '.github/workflows/affiliate_engine_post.yml'
      - '.github/workflows/affiliate_engine_insight.yml'
      - '.github/workflows/affiliate_engine_overlay_status.yml'
      - '.github/workflows/affiliate_yaml_guard.yml'

concurrency:
  group: affiliate-yaml-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Secret env があり本文アフィと amplify フラグが YAML に無い
        run: |
          set -euo pipefail
          for f in .github/workflows/affiliate_engine_post.yml .github/workflows/affiliate_engine_insight.yml; do
            grep -q 'AFFILIATE_LINKS_JSON' "$f"
            if grep -q 'AMPLIFY_ENABLED' "$f"; then
              echo "AMPLIFY_ENABLED must not be in $f"
              exit 1
            fi
            if grep -q 'AFFILIATE_BODY_LINKS' "$f"; then
              echo "AFFILIATE_BODY_LINKS must not be in $f"
              exit 1
            fi
          done
          if grep -q "^  schedule:" .github/workflows/affiliate_engine_post.yml .github/workflows/affiliate_engine_insight.yml; then
            echo "schedule must stay off"
            exit 1
          fi
          status=.github/workflows/affiliate_engine_overlay_status.yml
          if [ -f "$status" ]; then
            grep -q 'AFFILIATE_LINKS_JSON' "$status"
            grep -q 'workflow_dispatch' "$status"
            if grep -q "^  schedule:" "$status"; then
              echo "overlay status must not have schedule"
              exit 1
            fi
            if grep -q 'threads-poster.js' "$status" || grep -q 'amplify.js' "$status"; then
              echo "overlay status must not post"
              exit 1
            fi
            if grep -q 'AMPLIFY_ENABLED' "$status" || grep -q 'AFFILIATE_BODY_LINKS' "$status"; then
              echo "overlay status must not enable body links or amplify"
              exit 1
            fi
          fi
