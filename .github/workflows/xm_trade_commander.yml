name: XM Trade 司令塔コメント（発注しない）

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

concurrency:
  group: xm-trade-commander
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'XM Trade — 日次レポート'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.repository.default_branch }}

      - name: コメントを commander.json へ
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd xm-trade-engine
          node --check src/apply-commander-comment.js
          node src/apply-commander-comment.js

      - name: 状態を保存
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add xm-trade-engine/output/state/commander.json || true
          git diff --staged --quiet || {
            git commit -m "chore: Grok 司令塔コメントを commander へ"
            git pull --rebase origin "$DEFAULT_BRANCH"
            git push origin "HEAD:$DEFAULT_BRANCH"
          }
