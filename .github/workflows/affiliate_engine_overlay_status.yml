name: Affiliate Secret 重ね確認（投稿しない）

on:
  # 2026-08-28 計測回転。schedule は足さない。cron は戻さない。
  # 埋まっている link_key 名と件数だけ出す。URL は出さない。実投稿しない。
  workflow_dispatch:

concurrency:
  group: affiliate-overlay-status
  cancel-in-progress: false

jobs:
  overlay-status:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: 埋まっている鍵名だけ出す
        env:
          AFFILIATE_LINKS_JSON: ${{ secrets.AFFILIATE_LINKS_JSON }}
        run: |
          set -euo pipefail
          cd affiliate-engine
          node --check src/overlay-keys.js
          node src/overlay-keys.js --self-test
          node src/overlay-keys.js
