name: サクラ起動キーを Issue に掲示

# 本線は Grok Bot A が毎朝 raw URL で keys/<date>.md を読む。
# CURRENT.json を JST 今日に写すと、Issue「サクラ起動キー」へ今日のキーを書く。
# GitHub cron はデフォルトブランチ専用なので付けない（側線。円の席を壊さない）。
on:
  workflow_dispatch:
  push:
    paths:
      - 'sakura-ig/keys/CURRENT.json'
      - 'sakura-ig/src/handoff.js'
      - '.github/workflows/sakura_ig_handoff.yml'

concurrency:
  group: sakura-ig-handoff
  cancel-in-progress: false

jobs:
  handoff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: 銀行を検品
        run: node sakura-ig/src/validate-keys.js

      - name: Issue に掲示
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node sakura-ig/src/handoff.js
          test -f sakura-ig/output/handoff-latest.md
