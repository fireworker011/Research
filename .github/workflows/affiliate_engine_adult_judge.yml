name: Affiliate Engine アダアフィキャッシュループ（判定のみ）

on:
  schedule:
    # 06:47 JST。動画判定(06:37)の後。遅延前提。投稿しない。数字は発明しない。
    - cron: '47 21 * * *'
  workflow_dispatch:

concurrency:
  group: affiliate-adult-judge
  cancel-in-progress: false

jobs:
  adult-judge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: claude/setup-colab-comfyui-Eb9Lh
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 判定
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cd affiliate-engine
          node --check src/adult-judge.js
          node src/adult-judge.js --self-test
          node src/adult-judge.js

      - name: 判定を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add affiliate-engine/output/adult || true
          git diff --staged --quiet || {
            git commit -m "chore: アダアフィキャッシュループの日次判定"
            git pull --rebase origin claude/setup-colab-comfyui-Eb9Lh
            git push origin claude/setup-colab-comfyui-Eb9Lh
          }
