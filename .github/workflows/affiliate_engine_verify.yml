name: Affiliate Engine 検証（投稿しない）

on:
  pull_request:
  push:
    paths:
      - 'affiliate-engine/**'
      - '.github/workflows/affiliate_engine_verify.yml'

concurrency:
  group: affiliate-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Secret重ねと URL 非漏洩を検証
        run: |
          cd affiliate-engine
          node --check src/util.js
          node --check src/threads-poster.js
          node --check src/amplify.js
          node scripts/verify-secret-overlay.js
