name: Affiliate 確定円コメント（投稿しない）

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

concurrency:
  group: affiliate-a8-yen
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'Affiliate — 確定円'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.repository.default_branch }}

      - name: A8_YEN を conversions.csv へ
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd affiliate-engine
          node --check src/apply-a8-yen.js
          node src/apply-a8-yen.js --self-test
          node src/apply-a8-yen.js

      - name: 行を保存
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add affiliate-engine/data/conversions.csv || true
          git diff --staged --quiet || {
            git commit -m "chore: A8 確定円を conversions へ"
            git pull --rebase origin "$DEFAULT_BRANCH"
            git push origin "HEAD:$DEFAULT_BRANCH"
          }
